name: Build and Push Images

on:
  push:
    branches:
      - develop

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      AWS_REGION: eu-north-1
      AWS_ACCOUNT_ID: 755035179764

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build API Image
        run: |
          docker build -t geoaccess-api ./WebApplication1
          docker tag geoaccess-api:latest $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/geoaccess-api:latest

      - name: Push API Image
        run: |
          docker push $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/geoaccess-api:latest

      - name: Create UI Environment File
        run: |
          echo "VITE_API_BASE_URL=${{ secrets.VITE_API_BASE_URL }}" > Ui/.env.production

      - name: Build UI Image
        run: |
          docker build -t geoaccess-ui ./Ui
          docker tag geoaccess-ui:latest $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/geoaccess-ui:latest

      - name: Push UI Image
        run: |
          docker push $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/geoaccess-ui:latest

      - name: Build Postgres Image
        run: |
          docker build -t geoaccess-postgres ./postgres
          docker tag geoaccess-postgres:latest $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/geoaccess-postgres:latest

      - name: Push Postgres Image
        run: |
          docker push $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/geoaccess-postgres:latest
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USERNAME }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          aws ecr get-login-password --region eu-north-1 | docker login --username AWS --password-stdin 755035179764.dkr.ecr.eu-north-1.amazonaws.com

          docker pull 755035179764.dkr.ecr.eu-north-1.amazonaws.com/geoaccess-api:latest
          docker pull 755035179764.dkr.ecr.eu-north-1.amazonaws.com/geoaccess-ui:latest

          docker stop api-test || true
          docker stop ui-test || true

          docker rm api-test || true
          docker rm ui-test || true

          cd ~/geoaccess

          docker-compose -f docker-compose.prod.yml up -d api ui

          docker image prune -f